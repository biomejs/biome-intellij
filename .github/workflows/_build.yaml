# Reusable Build Workflow
name: _Build

on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
        required: false
        description: 'Publish a nightly build'
      artifact:
        type: boolean
        required: false
        default: false
        description: 'Create an artifact for the compiled plugin'
    outputs:
      version:
        value: ${{ jobs.build-plugin.outputs.version }}
        description: 'Version of the built plugin'
      nightly:
        value: ${{ inputs.nightly }}
        description: "Whether or not the build is a nightly build"

jobs:
  build-plugin:
    name: Build Plugin
    runs-on: depot-ubuntu-24.04-arm-16
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Read version from gradle.properties (nightly)
        if: ${{ inputs.nightly }}
        id: original-version
        run: echo "version=$(grep -P '^pluginVersion=\K(.+)$' -o gradle.properties)" >> $GITHUB_OUTPUT

      - name: Generate nightly version identifier (nightly)
        if: ${{ inputs.nightly }}
        id: nightly-version
        run: echo "version=${{ steps.original-version.outputs.version }}-nightly.$(echo '${{ github.sha }}' | cut -c 1-7)" >> "$GITHUB_OUTPUT"

      - name: Replace version in gradle.properties (nightly)
        if: ${{ inputs.nightly }}
        run: sed -i -E 's/^pluginVersion=.*/pluginVersion=${{ steps.nightly-version.outputs.version }}/' gradle.properties

      - name: Read final version
        id: version
        run: echo "version=$(grep -P '^pluginVersion=\K(.+)$' -o gradle.properties)" >> $GITHUB_OUTPUT

      - name: Build
        run: ./gradlew buildPlugin

      - name: Cache gradle.properties
        if: ${{ inputs.artifact }}
        uses: actions/cache@v3
        with:
          path: gradle.properties
          key: gradle.properties.${{ github.sha }}

      - name: Upload plugin artifact
        if: ${{ inputs.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: Biome-${{ steps.version.outputs.version }}.zip
          path: build/distributions/intellij-biome-${{ steps.version.outputs.version }}.zip

  regression-tests:
    name: Plugin regression tests
    # IDE runtime regression coverage is validated on Linux x64.
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.5.2 --activate
      - name: Test report checker
        run: python3 .github/scripts/test-check-required-tests.py
      - name: Run plugin regression tests
        run: python3 .github/scripts/run-required-tests.py
      - name: Require all expected tests to pass
        if: always()
        run: python3 .github/scripts/check-required-tests.py build/test-results/test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-regression-results
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: error
